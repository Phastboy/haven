[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Domain
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.11"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

# DB
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate", "macros"] }

# Web
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.9", features = ["mail", "session", "router", "tailwind"] }

# Internal
haven-domain = { path = "crates/haven-domain" }
haven-db = { path = "crates/haven-db" }
