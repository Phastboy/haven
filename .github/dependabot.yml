version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/expts/rust"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(actions)"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/expts/rust"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    open-pull-requests-limit: 10
