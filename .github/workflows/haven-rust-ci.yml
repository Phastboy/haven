name: Haven Rust CI

on:
  pull_request:
    paths:
      - 'expts/rust/**'
      - '.github/workflows/haven-rust-*'
  push:
    branches:
      - main
    paths:
      - 'expts/rust/**'
      - '.github/workflows/haven-rust-*'
  workflow_dispatch:
    inputs:
      load_review:
        description: Build release binaries for isolated local load testing
        type: boolean
        default: false
      category_review:
        description: Regenerate SQLx metadata and export synthetic feed snapshots
        type: boolean
        default: false

concurrency:
  group: haven-rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Document
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: expts/rust

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: haven
          POSTGRES_PASSWORD: haven_password
          POSTGRES_DB: haven
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://haven:haven_password@localhost:5432/haven
      SQLX_OFFLINE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "expts/rust -> target"

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Prepare fresh database for category review
        if: inputs.category_review
        run: |
          for migration in migrations/*.sql; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Regenerate SQLx metadata against PostgreSQL
        if: inputs.category_review
        env:
          SQLX_OFFLINE: "false"
          SQLX_OFFLINE_DIR: /tmp/haven-category-review/sqlx
        run: |
          mkdir -p "$SQLX_OFFLINE_DIR"
          cargo check -p haven-db --all-targets --locked
          cp "$SQLX_OFFLINE_DIR"/query-*.json .sqlx/

      - name: Lint with Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Install Topcoat CLI
        run: cargo install topcoat-cli --version 0.11.0 --locked

      - name: Bundle Topcoat assets
        run: topcoat asset bundle --package haven-web

      - name: Run unit & integration tests
        env:
          HAVEN_PREVIEW_DIR: ${{ inputs.category_review && '/tmp/haven-category-review/feed' || '' }}
        run: cargo test --workspace --locked

      - name: Run doctests
        run: cargo test --doc --workspace --locked

      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.0"
          cache-dependency-path: expts/rust/crates/haven-web/load-tests/go/go.mod

      - name: Test Go load runner
        working-directory: expts/rust/crates/haven-web/load-tests/go
        run: go test ./... && go vet ./...

      - name: Validate documentation (-D warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items

      - name: Export category review artifacts
        if: always() && inputs.category_review
        uses: actions/upload-artifact@v7
        with:
          name: category-review
          path: /tmp/haven-category-review
          if-no-files-found: error
          retention-days: 7

      - name: Build release load-test artifacts
        if: inputs.load_review
        run: |
          cargo build --release --locked -p haven-web -p load-test-support
          topcoat asset bundle --package haven-web --release
          mkdir -p /tmp/haven-load-review
          tar -czf /tmp/haven-load-review/release.tar.gz -C target/release haven-web load-test-support assets
          git rev-parse HEAD > /tmp/haven-load-review/revision.txt

      - name: Export release load-test artifacts
        if: inputs.load_review
        uses: actions/upload-artifact@v7
        with:
          name: load-review
          path: /tmp/haven-load-review
          if-no-files-found: error
          retention-days: 7
