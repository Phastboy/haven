services:
  db:
    image: postgres:15
    container_name: haven-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    networks:
      - haven_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Note: /docker-entrypoint-initdb.d executes only when postgres_data volume is freshly initialized.
      # If reusing an existing volume, create haven_rust manually:
      #   docker exec -i haven-postgres psql -U user -d mydb -c "CREATE DATABASE haven_rust;"
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  haven_net:

volumes:
  postgres_data:
