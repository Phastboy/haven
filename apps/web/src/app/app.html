<div class="layout">
  <header style="display: flex; justify-content: flex-end; align-items: center; padding: 1rem; gap: 0.75rem; border-bottom: 1px solid var(--p-content-border-color);">
    <i class="pi pi-sun" style="color: var(--p-text-color)"></i>
    <p-toggleswitch [(ngModel)]="isDarkMode" (ngModelChange)="onDarkModeChange($event)" aria-label="Toggle Dark Mode"></p-toggleswitch>
    <i class="pi pi-moon" style="color: var(--p-text-color)"></i>
  </header>
  <main>
    <router-outlet></router-outlet>
  </main>
</div>
<p-toast></p-toast>
