<div class="verify-container">
  @if (verifying()) {
  <div class="loader-content">
    <p-progress-spinner ariaLabel="Verifying magic link"></p-progress-spinner>
    <p>Verifying your magic link...</p>
  </div>
  } @else {
  <div class="error-content">
    <i class="pi pi-exclamation-circle" style="font-size: 3rem; color: var(--p-red-500)"></i>
    <h2 style="color: var(--p-red-500)">{{ errorMsg() }}</h2>
    <a pButton routerLink="/auth/login" label="Back to Login" class="p-button-outlined"></a>
  </div>
  }
</div>
