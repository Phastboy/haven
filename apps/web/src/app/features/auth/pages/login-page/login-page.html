<div class="login-container">
  <p-card header="Welcome to Haven" subheader="Sign in with a magic link" [style]="{ width: '100%', maxWidth: '400px' }">
    <form novalidate (submit)="onSubmit($event)" class="form-wrapper">
      <div style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%;">
        <p-floatlabel>
          <input pInputText id="email" type="email" [formField]="magicForm.email" style="width: 100%" />
          <label for="email">Email Address</label>
        </p-floatlabel>

        @if (magicForm.email().touched() && magicForm.email().invalid()) {
          @for (error of magicForm.email().errors(); track error.kind) {
            <p-message severity="error" size="small" variant="simple">{{ error.message }}</p-message>
          }
        }
      </div>
      
      <p-button type="submit" label="Send Magic Link" icon="pi pi-envelope" [loading]="loading()" [disabled]="magicForm().invalid()" styleClass="w-full"></p-button>
    </form>
  </p-card>
</div>
