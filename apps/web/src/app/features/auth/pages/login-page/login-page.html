<!-- login-page.html -->
<div class="scene">
  <div class="panel">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Haven</span>
    </div>

    <div class="intro">
      <h1>Welcome back</h1>
      <p>Enter your email and we'll send you a link to sign in — no password to remember.</p>
    </div>

    <form novalidate (submit)="onSubmit($event)" class="form">
      <div class="field">
        <p-floatlabel>
          <input
            pInputText
            id="email"
            type="email"
            [formField]="magicForm.email"
            style="width: 100%"
          />
          <label for="email">Email address</label>
        </p-floatlabel>

        @if (magicForm.email().touched() && magicForm.email().invalid()) { @for (error of
        magicForm.email().errors(); track error.kind) {
        <p-message severity="error" size="small" variant="simple">{{ error.message }}</p-message>
        } }
      </div>

      <p-button
        type="submit"
        label="Send magic link"
        icon="pi pi-envelope"
        [loading]="loading()"
        [disabled]="magicForm().invalid()"
        [style]="{ width: '100%' }"
      ></p-button>
    </form>
  </div>
</div>
