<div class="appearance-container">
  <div class="settings-panel">
    <h2>Appearance Settings</h2>
    <p class="description">Customize the interface theme. Select system to mirror your operating system settings.</p>

    <div class="setting-item">
      <span class="setting-label">Theme Preference</span>
      <p-selectbutton 
        [options]="options" 
        [(ngModel)]="selectedTheme" 
        optionLabel="label" 
        optionValue="value"
        [allowEmpty]="false">
        <ng-template let-item #item>
            <i [class]="item.icon"></i>
            <span class="ml-2">{{ item.label }}</span>
        </ng-template>
      </p-selectbutton>
    </div>
  </div>
</div>
