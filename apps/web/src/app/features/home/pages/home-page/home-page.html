<div
  class="flex flex-col items-center justify-center min-h-screen bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-0"
>
  <div
    class="p-8 bg-surface-0 dark:bg-surface-900 rounded-xl shadow-lg flex flex-col items-center gap-6 border border-surface-200 dark:border-surface-800 w-full max-w-sm"
  >
    <i class="pi pi-check-circle text-green-500" style="font-size: 4rem"></i>

    <div class="text-center">
      <h1 class="text-3xl font-bold mb-2">Welcome!</h1>
      @if (auth.user()) {
      <p class="text-surface-600 dark:text-surface-400">
        Logged in as <br />
        <span class="font-semibold text-primary-500">{{ auth.user().email }}</span>
      </p>
      }
    </div>

    <div class="w-full h-px bg-surface-200 dark:bg-surface-800 my-2"></div>

    <p-button
      label="Logout"
      icon="pi pi-sign-out"
      severity="danger"
      (onClick)="auth.logout()"
      styleClass="w-full"
    >
    </p-button>
  </div>
</div>
